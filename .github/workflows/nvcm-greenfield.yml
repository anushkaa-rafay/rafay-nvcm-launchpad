name: nvcm-greenfield
# GREENFIELD: nothing to preserve — author intent from scratch and push it to blank switches. Mirrors
# rafay_nvcm_poc's onboarding/greenfield/greenfield_adoption_plan.md (spreadsheet → blueprint → deploy).
#   lab (resolve the `lab` input → its GitHub Environment: which OCI host, which credentials)
#   → boot (start OCI → wait operational → workspace cleanup → clone the rafay_nvcm_poc branch)
#   → platform → site → bringup   (config/stages-greenfield.sh, executed ON the host)
#   → poweroff (always, unless shutdown=false) → report (always: artifact + dated commit under logs/)
# The installation logic lives in rafay_nvcm_poc; this repo only orchestrates it. See also: nvcm-brownfield.yml
# (adopting an ALREADY-RUNNING fabric) — the two share every job/script except the stage catalogue, and share
# one concurrency group PER LAB because, for a given lab, both drive the SAME physical OCI host.

run-name: "nvcm-greenfield · ${{ inputs.lab || vars.DEFAULT_LAB }} · ${{ inputs.poc_branch || vars.POC_DEFAULT_BRANCH || 'main' }} · ${{ inputs.stages || 'all' }}"

on:
  workflow_dispatch:
    inputs:
      lab:
        description: "Lab to run on (OCI or AWS) — the name of a GitHub Environment holding that lab's INSTANCE_ID, SSH host and any secrets that differ from the repo-level ones (blank uses the DEFAULT_LAB repository variable)"
        required: false
        default: ""
        type: string
      poc_branch:
        description: "rafay_nvcm_poc branch to run — blank uses the POC_DEFAULT_BRANCH repository variable (falls back to main if that isn't set either)"
        required: false
        default: ""
        type: string
      stages:
        description: "Stages: 'all' or a comma list — host-prep,platform-install-1,platform-install-2,verify-platform,blueprint,substrate,dc-bringup"
        required: true
        default: all
        type: string
      blueprint_source:
        description: "Blueprint for substrate/dc-bringup: generated (this run's blueprint stage) or committed (stc/blueprint_stc.yaml)"
        default: generated
        type: choice
        options: [generated, committed]
      tenants:
        description: "Tenant spec passed to simulate_dc.sh --tenants"
        default: "3-11,84-100"
        type: string
      shutdown:
        description: "Power the lab instance off at the end (untick to keep it up for debugging)"
        default: true
        type: boolean
  # Nightly run — uncomment to enable. Runs on vars.DEFAULT_LAB; uses vars.POC_DEFAULT_BRANCH (default main), all stages, and shuts down.
  # schedule:
  #   - cron: "30 20 * * *"   # 02:00 IST

# ONE run at a time PER LAB: a new run QUEUES behind the active one on the same lab (never cancels it); runs on
# different labs (different OCI hosts) go in parallel. SHARED with nvcm-brownfield.yml — both drive the same
# physical host for a given lab, so a brownfield run and a greenfield run on one lab must never overlap either.
# GitHub keeps at most one pending run per group — a third trigger on the same lab replaces the queued second.
concurrency:
  group: nvcm-oci-lab-${{ inputs.lab || vars.DEFAULT_LAB }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LAUNCHPAD_CATALOGUE: config/stages-greenfield.sh

jobs:
  # Resolves which lab this run targets and proves its GitHub Environment exists BEFORE any job names it:
  # GitHub silently auto-creates an Environment a job references, so a typo'd lab would otherwise leave an empty
  # Environment behind and fail later with a confusing "INSTANCE_ID not configured". Every job that touches
  # the lab (boot, the phases, poweroff) runs in this Environment, so vars.* / secrets.* resolve per lab.
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read         # GET /repos/{repo}/environments/{name}
    outputs:
      name: ${{ steps.lab.outputs.name }}
    steps:
      - name: Resolve + check lab
        id: lab
        env:
          LAB: ${{ inputs.lab || vars.DEFAULT_LAB }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$LAB" ] || { echo "::error::no lab given — set the 'lab' input (or the DEFAULT_LAB repository variable)"; exit 1; }
          [[ "$LAB" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid lab '$LAB' (letters, digits, . _ - only)"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/environments/$LAB" --silent 2>/dev/null \
            || { echo "::error::lab '$LAB' is not a GitHub Environment of this repo (Settings → Environments; see README → Setup)"; exit 1; }
          echo "name=$LAB" >> "$GITHUB_OUTPUT"
          echo "lab: $LAB"

  boot:
    needs: lab
    environment: ${{ needs.lab.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_key: ${{ steps.opts.outputs.run_key }}
      stages:  ${{ steps.opts.outputs.stages }}
    env:
      OUT: out/boot
      INSTANCE_ID:     ${{ vars.INSTANCE_ID }}
      SSH_USER:        ${{ vars.SSH_USER || 'ubuntu' }}
      SSH_HOST:        ${{ vars.SSH_HOST }}
      SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve + validate options
        id: opts
        env:
          BRANCH:   ${{ inputs.poc_branch || vars.POC_DEFAULT_BRANCH || 'main' }}
          STAGES:   ${{ inputs.stages || 'all' }}
          BP_SRC:   ${{ inputs.blueprint_source || 'generated' }}
          TENANTS:  ${{ inputs.tenants || '3-11,84-100' }}
          POC_REPO: ${{ vars.POC_REPO || 'ramakrishna-rafay/rafay_nvcm_poc' }}
          RUN_KEY:  ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # these values reach a remote shell — accept only plain names
          [[ "$BRANCH"   =~ ^[A-Za-z0-9._/-]+$ && "$BRANCH" != -* ]] || { echo "::error::invalid branch '$BRANCH'"; exit 1; }
          [[ "$POC_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]     || { echo "::error::invalid POC_REPO '$POC_REPO'"; exit 1; }
          [[ "$TENANTS"  =~ ^[0-9,-]+$ ]]                            || { echo "::error::invalid tenants '$TENANTS'"; exit 1; }
          STAGES="${STAGES// /}"; scripts/run-stages.sh validate "$STAGES"
          # branch existence is checked by the clone on the host (the repo is private to this runner)
          mkdir -p "$OUT"
          {
            echo "RUN_KEY=$RUN_KEY"; echo "POC_REPO=$POC_REPO"; echo "POC_BRANCH=$BRANCH"; echo "STAGES=$STAGES"
            echo "BLUEPRINT_SOURCE=$BP_SRC"; echo "TENANTS=$TENANTS"; echo "STARTED_AT=$(date -u +%FT%TZ)"
          } > "$OUT/meta.env"
          cat "$OUT/meta.env" >> "$GITHUB_OUTPUT"   # expression property names are case-insensitive

      - name: Lab access
        uses: ./.github/actions/lab-access
        with:
          lab:             ${{ needs.lab.outputs.name }}
          oci-user:        ${{ vars.OCI_USER }}
          oci-tenancy:     ${{ vars.OCI_TENANCY }}
          oci-fingerprint: ${{ vars.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region:      ${{ vars.OCI_REGION }}
          aws-access-key-id:     ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          poc-deploy-key:  ${{ secrets.POC_DEPLOY_KEY }}

      - name: Start lab instance
        id: start
        # set -o pipefail: a run: step with no explicit `shell:` key is NOT pipefail by default (verified
        # empirically, not assumed — see Dev_Guide.md's design-decisions section). Without it, a failing
        # scripts/lab.sh here is masked by tee's own always-zero exit, and this step would report success
        # even though the instance never actually started.
        run: set -o pipefail; scripts/lab.sh start 2>&1 | tee -a "$OUT/boot.log"

      - name: Wait until operational
        id: connect
        run: |
          set -o pipefail   # see the note on "Start OCI instance" above
          scripts/lab.sh connect 2>&1 | tee -a "$OUT/boot.log"
          scripts/lab.sh push-agent

      - name: Clean workspace + clone rafay_nvcm_poc
        env:
          KEY:      ${{ steps.opts.outputs.run_key }}
          POC_REPO: ${{ steps.opts.outputs.POC_REPO }}
          BRANCH:   ${{ steps.opts.outputs.POC_BRANCH }}
          BP_SRC:   ${{ steps.opts.outputs.BLUEPRINT_SOURCE }}
          TENANTS:  ${{ steps.opts.outputs.TENANTS }}
          LAB_IP: ${{ vars.LAB_IP }}
        run: |
          set -o pipefail   # see "Start OCI instance" above
          # -A forwards the agent for this one command only: the deploy key never touches the host's disk.
          # BP_SRC/TENANTS reach the remote shell unescaped by design — both are already regex-validated above
          # to plain charsets with no spaces (see "Resolve + validate options"), so plain interpolation is safe.
          scripts/lab.sh ssh -A "LAB_IP='$LAB_IP' launchpad/agent.sh prepare $KEY $POC_REPO $BRANCH BLUEPRINT_SOURCE=$BP_SRC TENANTS=$TENANTS" \
            2>&1 | tee -a "$OUT/boot.log"
          grep -m1 '^POC_SHA=' "$OUT/boot.log" >> "$OUT/meta.env"

      - name: Record boot metadata
        if: always()
        env:
          LAB:         ${{ needs.lab.outputs.name }}
          HOST:        ${{ steps.connect.outputs.host }}
          WAS_RUNNING: ${{ steps.start.outputs.was_running }}
        run: |
          mkdir -p "$OUT"
          { echo "LAB=$LAB"; echo "INSTANCE_ID=$INSTANCE_ID"; echo "HOST=$HOST"; echo "WAS_RUNNING=$WAS_RUNNING"; } >> "$OUT/meta.env"

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-boot
          path: ${{ env.OUT }}
          if-no-files-found: ignore
          retention-days: 30

  # Strictly sequential: boot → platform → site → bringup → poweroff → report. A phase runs only if EVERY
  # phase before it succeeded; after the first failure (❌) the later phases are SKIPPED (grey ⊘ in the run
  # graph), never run-and-green. Every `if:` below names its status function (!cancelled()) and the exact
  # needs.*.result it requires, explicitly: a job relying on the implicit success() check can be wrongly
  # skipped when any job further upstream was skipped (actions/runner#2205) — explicit conditions are that
  # issue's documented workaround, and are what keeps poweroff/report running after a skipped phase.
  platform:
    needs: [lab, boot]
    if: ${{ !cancelled() && needs.boot.result == 'success' }}
    uses: ./.github/workflows/_phase.yml
    with: { phase: platform, lab: "${{ needs.lab.outputs.name }}", run_key: "${{ needs.boot.outputs.run_key }}", stages: "${{ needs.boot.outputs.stages }}", catalogue: config/stages-greenfield.sh }
    secrets: inherit

  site:
    needs: [lab, boot, platform]
    if: ${{ !cancelled() && needs.boot.result == 'success' && needs.platform.result == 'success' }}
    uses: ./.github/workflows/_phase.yml
    with: { phase: site, lab: "${{ needs.lab.outputs.name }}", run_key: "${{ needs.boot.outputs.run_key }}", stages: "${{ needs.boot.outputs.stages }}", catalogue: config/stages-greenfield.sh }
    secrets: inherit

  bringup:
    needs: [lab, boot, site]
    if: ${{ !cancelled() && needs.boot.result == 'success' && needs.site.result == 'success' }}
    uses: ./.github/workflows/_phase.yml
    with: { phase: bringup, lab: "${{ needs.lab.outputs.name }}", run_key: "${{ needs.boot.outputs.run_key }}", stages: "${{ needs.boot.outputs.stages }}", catalogue: config/stages-greenfield.sh }
    secrets: inherit

  poweroff:
    needs: [lab, boot, platform, site, bringup]
    environment: ${{ needs.lab.outputs.name }}
    # !cancelled(): also after a failure or a skipped phase — see the note above the `platform` job.
    # Non-dispatch triggers (schedule) always shut down.
    if: ${{ !cancelled() && needs.lab.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.shutdown) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lab-access
        with:
          lab:             ${{ needs.lab.outputs.name }}
          oci-user:        ${{ vars.OCI_USER }}
          oci-tenancy:     ${{ vars.OCI_TENANCY }}
          oci-fingerprint: ${{ vars.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region:      ${{ vars.OCI_REGION }}
          aws-access-key-id:     ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}
      - name: Stop lab instance
        run: scripts/lab.sh stop

  report:
    needs: [lab, boot, platform, site, bringup, poweroff]
    # !cancelled(), not always() — see the note on the poweroff job above.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # the dated log commit — the only write this workflow makes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        continue-on-error: true      # nothing to download if boot died before its upload; the report says so
        with:
          pattern: logs-*
          path: collected

      - name: Build report
        id: report
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
          LAB: ${{ needs.lab.outputs.name || inputs.lab || vars.DEFAULT_LAB }}
          RESULT_LAB: ${{ needs.lab.result }}
          RESULT_BOOT: ${{ needs.boot.result }}
          RESULT_PLATFORM: ${{ needs.platform.result }}
          RESULT_SITE: ${{ needs.site.result }}
          RESULT_BRINGUP: ${{ needs.bringup.result }}
          RESULT_POWEROFF: ${{ needs.poweroff.result }}
        run: |
          mkdir -p collected
          scripts/build-report.sh collected report
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run report
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: report
          retention-days: 90

      - name: Commit logs to logs/<Mon-YYYY>/<DD-Mon-YYYY>
        run: scripts/commit-logs.sh report

      # Future notifiers (email / shared drive / Slack) go here, reading report/summary.json.

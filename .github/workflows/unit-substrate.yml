name: unit-substrate
# Unit tests · 3 · Substrate — every rafay_nvcm_poc offline gate config/unit-tests.sh places in the 'substrate' phase, in ONE
# workflow (groups: substrate — parallel jobs inside it). Thin caller: the mechanics are _unit.yml's. No lab is
# touched, so this can run alongside any lab run. Manual, or callable from another workflow (e.g. as a
# pre-flight in front of nvcm-greenfield.yml / nvcm-brownfield.yml — not wired in yet). See Unit_Tests_Plan.md.

run-name: "unit-substrate · ${{ inputs.poc_branch || vars.POC_DEFAULT_BRANCH || 'main' }} · ${{ inputs.groups || 'all' }}"

on:
  workflow_dispatch:
    inputs:
      poc_branch:
        description: "rafay_nvcm_poc branch to test — blank uses the POC_DEFAULT_BRANCH repository variable (falls back to main)"
        required: false
        default: ""
        type: string
      groups:
        description: "Groups: 'all' or a comma list — substrate"
        required: true
        default: all
        type: string
  workflow_call:
    inputs:
      poc_branch: { type: string, default: "" }
      groups:     { type: string, default: all }

# No shared host here, so a newer run of the same phase + branch simply replaces an older one.
concurrency:
  group: unit-substrate-${{ inputs.poc_branch || vars.POC_DEFAULT_BRANCH || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: 3 · Substrate
    uses: ./.github/workflows/_unit.yml
    with: { phase: substrate, poc_branch: "${{ inputs.poc_branch }}", groups: "${{ inputs.groups || 'all' }}" }
    secrets: inherit
